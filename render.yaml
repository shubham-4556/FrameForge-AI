services:
  - type: web
    name: frameforge-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health/live
    buildCommand: npm run render:build:api
    startCommand: npm run render:start:api
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SIGNING_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_INTERNAL_URL
        sync: false

      # ── AI (OpenAI) ────────────────────────────────────────────────────────
      # Get a key at https://platform.openai.com/api-keys
      # Then change AI_PROVIDER to "openai" and set the same values on the worker.
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_TEXT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: alloy
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: AI_GENERATE_IMAGES
        value: "false"

      # ── Object storage (required for shareable uploads + worker outputs) ───
      # Any S3-compatible store works: Cloudflare R2, AWS S3, Backblaze B2.
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./.data/storage
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"

      # ── Billing (Stripe, optional) ─────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_STUDIO
        sync: false

      # ── Email (optional) ───────────────────────────────────────────────────
      - key: MAIL_DRIVER
        value: log
      - key: MAIL_FROM
        value: FrameForge AI <no-reply@frameforge.ai>
      - key: SMTP_URL
        sync: false
